<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ org_name }} Photobooth — Club Day 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__logos">
        <img class="topbar__logo topbar__logo--uni" src="/static/img/logo-bachkhoa.png" alt="ĐH Bách Khoa TP.HCM" width="44" height="44" />
        <span class="topbar__divider" aria-hidden="true"></span>
        <img class="topbar__logo topbar__logo--club" src="/static/img/logo-bkfire.png" alt="BK FIRE" width="40" height="40" />
      </div>

      <div class="topbar__center">
        <span class="event-pill">📸 Photobooth · Club Day 2026</span>
      </div>

      <div class="topbar__clock" aria-live="polite">
        <time id="clockTime" class="topbar__time">00:00:00</time>
        <time id="clockDate" class="topbar__date">--.--.----</time>
      </div>
    </header>

    <div class="sysbar" aria-label="Trạng thái hệ thống">
      <div class="sysbar__inner">
        <div class="sysbar__items">
          <div class="sys-item" data-key="camera">
            <span class="sys-dot is-warn" id="dotCamera"></span>
            <span class="sys-label">Máy ảnh:</span>
            <span class="sys-value is-warn" id="valCamera">chờ kết nối</span>
          </div>
          <div class="sys-item" data-key="webcam">
            <span class="sys-sep">·</span>
            <span class="sys-dot is-ok" id="dotWebcam"></span>
            <span class="sys-label">Webcam:</span>
            <span class="sys-value" id="valWebcam">—</span>
          </div>
          <div class="sys-item" data-key="printer">
            <span class="sys-sep">·</span>
            <span class="sys-dot is-ok" id="dotPrinter"></span>
            <span class="sys-label">Printer:</span>
            <span class="sys-value" id="valPrinter">—</span>
          </div>
          <div class="sys-item" data-key="cloud">
            <span class="sys-sep">·</span>
            <span class="sys-dot {% if cloudinary_enabled %}is-ok{% else %}is-warn{% endif %}" id="dotCloud"></span>
            <span class="sys-label">Cloudinary:</span>
            <span class="sys-value" id="valCloud">{% if cloudinary_enabled %}OK{% else %}chưa cấu hình{% endif %}</span>
          </div>
          <div class="sys-item" data-key="last">
            <span class="sys-sep">·</span>
            <span class="sys-dot is-muted" id="dotLast"></span>
            <span class="sys-label">Last:</span>
            <span class="sys-value" id="valLast">—</span>
          </div>
        </div>
        <div class="sysbar__pulse" title="System">
          <span class="sys-label">SYS</span>
          <span class="pulse-bars" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
        </div>
      </div>
    </div>

    <main class="stage">
      <section class="viewport" id="viewport" aria-label="Live camera feed">
        <video
          id="liveVideo"
          class="viewport__video"
          playsinline
          muted
          autoplay
          hidden
        ></video>

        <div class="viewport__idle" id="viewportIdle">
          <div class="viewport__focus">
            <img class="viewport__cam-icon" src="/static/img/icons/icon-camera-placeholder.svg" alt="" width="80" height="80" />
            <img class="viewport__bracket" src="/static/img/icons/icon-focus-bracket.svg" alt="" width="72" height="72" />
          </div>
          <p class="viewport__title">LIVE CAMERA FEED</p>
          <p class="viewport__subtitle" id="viewportSubtitle">Preview đang tắt — bấm để bật khi cần</p>
          <button type="button" class="enable-cam" id="btnEnableCam">
            Bật Preview Webcam
          </button>
        </div>

        <div class="live-badge" id="liveBadge">
          <span class="live-badge__dot"></span>
          <span id="liveBadgeText">OFF</span>
        </div>
        <button type="button" class="preview-toggle" id="btnPreviewToggle" aria-pressed="false" title="Bật/tắt live webcam">
          Preview <span id="previewToggleState">OFF</span>
        </button>
        <div class="res-badge" id="resBadge">—</div>

        <fieldset class="style-chip" aria-label="Kiểu dither in">
          <legend>Kiểu in</legend>
          <label class="style-chip__opt">
            <input type="radio" name="ditherStyle" value="floyd" checked />
            <span>Floyd</span>
          </label>
          <label class="style-chip__opt">
            <input type="radio" name="ditherStyle" value="comic" />
            <span>Comic-dot</span>
          </label>
        </fieldset>
      </section>

      <aside class="result-drawer" id="resultDrawer" hidden aria-label="Kết quả chụp">
        <div class="result-drawer__head">
          <h2>Kết quả</h2>
          <button type="button" class="result-drawer__close" id="btnCloseResult" aria-label="Đóng">×</button>
        </div>
        <p id="resultMsg" class="result-drawer__msg"></p>
        <img id="photoPreview" class="result-drawer__photo" alt="Ảnh đã chụp" />
        <div class="result-drawer__thumbs" id="frameGrid"></div>
        <figure class="result-drawer__print">
          <figcaption>Layout in</figcaption>
          <img id="printPreview" alt="Layout máy in nhiệt" />
        </figure>
      </aside>

      <div class="actions" role="group" aria-label="Chụp và in">
        <button id="btnCamera" class="btn btn--primary" type="button" disabled>
          <img src="/static/img/icons/icon-camera.svg" alt="" width="22" height="22" />
          <span class="btn__text">
            <span class="btn__label">Chụp bằng Máy Ảnh &amp; In</span>
            <span class="btn__hint" id="hintCamera">Capture by Camera &amp; Print</span>
          </span>
        </button>

        <button id="btnWebcam" class="btn btn--primary btn--solid" type="button" disabled>
          <img src="/static/img/icons/icon-webcam.svg" alt="" width="22" height="22" />
          <span class="btn__text">
            <span class="btn__label">Chụp bằng Webcam &amp; In</span>
            <span class="btn__hint" id="hintWebcam">Capture by Webcam &amp; Print</span>
          </span>
        </button>

        <div class="reprint-group">
          <label class="copies-chip" for="reprintCopies">
            <span>Copies</span>
            <input
              id="reprintCopies"
              type="number"
              min="1"
              max="20"
              value="1"
              inputmode="numeric"
              aria-label="Số bản in lại"
            />
          </label>
          <button id="btnReprint" class="btn btn--outline" type="button" disabled>
            <img src="/static/img/icons/icon-reprint.svg" alt="" width="20" height="20" />
            <span class="btn__text">
              <span class="btn__label">In lại</span>
              <span class="btn__hint" id="hintReprint">Reprint</span>
            </span>
          </button>
        </div>
      </div>

      <div id="statusBar" class="toast" role="status" aria-live="polite" hidden></div>
    </main>
  </div>

  <script>
    window.BOOTH_CONFIG = {
      burstCount: {{ burst_count }},
      burstIntervalSec: {{ burst_interval_sec }},
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
