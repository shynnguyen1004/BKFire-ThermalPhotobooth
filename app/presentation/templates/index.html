<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ org_name }} Photobooth — Club Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="booth">
    <header class="brand">
      <p class="brand__mark">{{ org_name }}</p>
      <p class="brand__sub">Club Day Photobooth</p>
    </header>

    <section class="panel" aria-label="Điều khiển chụp in">
      <label class="field">
        <span>Khoa / Ngành</span>
        <select id="faculty" name="faculty" required>
          <option value="" disabled selected>— Chọn khoa / ngành —</option>
          {% for f in faculties %}
          <option value="{{ f }}">{{ f }}</option>
          {% endfor %}
        </select>
      </label>

      <p class="cloud-note" id="cloudNote">
        {% if cloudinary_enabled %}
          QR sẽ dùng link Cloudinary (<code>{{ cloudinary_folder }}</code>) sau khi upload.
        {% else %}
          Cloudinary chưa cấu hình — thêm credentials vào <code>.env</code> để QR trỏ ảnh online.
        {% endif %}
      </p>

      <button id="captureBtn" class="cta" type="button">
        <span class="cta__label">CHỤP &amp; IN</span>
        <span class="cta__hint" id="captureHint">1 tấm dọc 3:4 · in giữa phiếu</span>
      </button>

      <div id="statusBar" class="status" role="status" aria-live="polite">
        Sẵn sàng. Kiểm tra máy ảnh &amp; máy in trước khi bấm.
      </div>
    </section>

    <aside class="preview" hidden id="preview">
      <h2>Kết quả</h2>
      <p id="resultMsg"></p>
      <div class="preview__frames" id="frameGrid"></div>
      <div class="preview__frames">
        <figure>
          <figcaption>Ảnh (Cloudinary)</figcaption>
          <img id="photoPreview" alt="Ảnh đã chụp" />
        </figure>
        <figure>
          <figcaption>Layout in (dithered)</figcaption>
          <img id="printPreview" alt="Layout máy in nhiệt" />
        </figure>
      </div>
    </aside>
  </main>

  <script>
    window.BOOTH_CONFIG = {
      burstCount: {{ burst_count }},
      burstIntervalSec: {{ burst_interval_sec }},
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
